services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./:/code
    env_file:
      - .env.dev.docker
    environment:
      - PG_DATABASE_HOSTNAME=postgres
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    env_file:
      - .env.dev.docker
    environment:
      - POSTGRES_PASSWORD=${PG_DATABASE_PASSWORD}
      - POSTGRES_USER=${PG_DATABASE_USERNAME}
      - POSTGRES_DB=${PG_DATABASE_NAME}
    volumes:
      - postgres-data:/data
    ports:
      - "5433:5432"

  redis:
    image: redis:latest
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:

networks:
  backend: